name: ocr_expense_tracker
description: OCR Expense Tracker & Receipt Parser - Mini Project 3
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Camera
  camera: ^0.11.0+2
  # Google ML Kit - On-device OCR
  google_mlkit_text_recognition: ^0.14.0
  # Local database
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.4
  # State management
  provider: ^6.1.2
  # Image handling
  image: ^4.3.0
  # Permissions
  permission_handler: ^11.3.1
  # Unique IDs
  uuid: ^4.5.1
  # Number formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
